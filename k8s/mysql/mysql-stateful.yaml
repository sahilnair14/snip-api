apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  serviceName: mysql 
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:latest
        ports:
        - containerPort: 3306
        env:
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: root-password
        volumeMounts:
          - name: mysql-db
            mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-db
      spec: 
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi 
