apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql-service

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mysql-service
rules:
- apiGroups: [""]
  resources: ["*"]
  verbs: ["get","list","watch","create"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mysql-service
roleRef:
  kind: Role
  name: mysql-service
  apiGroup: rbac.authorization.k8s.io
subjects:
- name: mysql-service
  kind: ServiceAccount
