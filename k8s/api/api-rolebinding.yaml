apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: 
  name: snip-role
rules:
- apiGroups: [""]
  resources: ["*"]
  verbs:
    - get
    - list
    - create
    - update

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snip-rolebinding
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: snip-role
subjects:
  - kind: ServiceAccount
    apiGroup: ""
    name: mysql-service
